<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <style>
        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fafafa;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        p {
            margin: 12px 0 6px 0;
            font-weight: 500;
        }
        input[type="text"], select {
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        input[type="button"] {
            padding: 8px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type="button"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form method="get" action="simpleform.html" class="wufoo">
        <h2>Order Form</h2>
        
        <p>What would you like to buy?</p>
        <select>
            <option value=" ">A</option>
            <option>B (+ 0.5$)</option>
            <option>C (+ 0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <label><input type="radio" name="rd"/> 1 - $10</label><br/>
        <label><input type="radio" name="rd"/> 2 - $20</label><br/>
        <label><input type="radio" name="rd"/> 3 - $25</label><br/>

        <p>Name <span style="color: red">*</span></p>
        <input type="text" name="firstname" placeholder="FirstName" size="15"/>
        <input type="text" name="lastname" placeholder="LastName" size="15"/>

        <p>Email</p>
        <input type="text" name="email" size="35" placeholder="example@email.com"/>

        <p>Phone Number</p>
        <input type="text" name="phone1" size="5"/> - 
        <input type="text" name="phone2" size="5"/> - 
        <input type="text" name="phone3" size="5"/>

        <p><input type="button" name="btSubmit" value="Submit"/></p>
    </form>
</body>
</html>
