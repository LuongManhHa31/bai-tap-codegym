<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-column">
            <h2>Cột bên trái chứa nội dung chính</h2>
            <p>Đây là khu vực nội dung chính của trang web chiếm 60% chiều rộng và được căn lề trái bằng <code>float: left</code>.</p>
        </div>
        <div class="right-column">
            <h3>Cột bên phải chứa sidebar</h3>
            <p>Khu vực sidebar chiếm 38% chiều rộng và được căn sang phải bằng <code>float: right</code>.</p>
        </div>
    </div>
</body>
</html>
